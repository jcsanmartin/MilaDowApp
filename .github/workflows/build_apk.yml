name: Build Android APK (MilaDow)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle properties (Fix NoHttpResponseException)
        run: |
          mkdir -p ~/.gradle
          echo "systemProp.http.keepAlive=false" >> ~/.gradle/gradle.properties
          echo "systemProp.https.keepAlive=false" >> ~/.gradle/gradle.properties
          echo "systemProp.http.conn.keepAlive=false" >> ~/.gradle/gradle.properties
          echo "systemProp.https.conn.keepAlive=false" >> ~/.gradle/gradle.properties
          echo "systemProp.http.socketTimeout=120000" >> ~/.gradle/gradle.properties
          echo "systemProp.https.socketTimeout=120000" >> ~/.gradle/gradle.properties
          echo "systemProp.http.connectionTimeout=120000" >> ~/.gradle/gradle.properties
          echo "systemProp.https.connectionTimeout=120000" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true -Xmx2048m" >> ~/.gradle/gradle.properties

      - name: Install dependencies & Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flet-cli


      - name: Build APK (with automatic retry on network failure)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_on: error
          command: flet build apk --arch arm64-v8a --yes

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MilaDow-Android-APK
          path: build/apk/*.apk
